[package]
name = "studio-pulse"
version = "0.1.0"
description = "Studio Pulse — automatic creative-application time tracker"
authors = ["Studio Pulse"]
edition = "2021"
rust-version = "1.82"
default-run = "studio-pulse"
publish = false

[lib]
# Library target so integration tests (tests/*.rs) and examples can reach the modules.
name = "studio_pulse_lib"
crate-type = ["rlib"]

[[bin]]
name = "studio-pulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.6"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
